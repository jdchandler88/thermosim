name: Slow validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC

jobs:
  slow:
    name: Grid convergence and large-grid tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libgl1
      - run: uv sync --all-extras
      - run: uv run python -m pytest -q -m slow
